services:
  - type: web
    name: ai-data-analyst-platform
    env: python
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m compileall -q .
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.fileWatcherType none --server.enableWebsocketCompression true --server.fastReruns true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: "none"
      - key: STREAMLIT_SERVER_RUN_ON_SAVE
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_BROWSER_SERVER_ADDRESS
        value: "ai-data-analyst-platform-7rhs.onrender.com"
      - key: STREAMLIT_BROWSER_SERVER_PORT
        value: "443"
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "chintukumaredu00@gmail.com"
      - key: SMTP_PASSWORD
        value: "bcrskjjmnkgfyqol"
      - key: SMTP_FROM
        value: "chintukumaredu00@gmail.com"
      - key: SMTP_USE_TLS
        value: "true"
      - key: APP_BASE_URL
        value: "https://ai-data-analyst-platform-7rhs.onrender.com"
      - key: NEON_DATABASE_URL
        value: "postgresql://neondb_owner:npg_O2UpcDyJLb9W@ep-holy-breeze-b4do39st.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: DB_TYPE
        value: "postgres"
