[server]
headless = true
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500
fileWatcherType = "none"
runOnSave = false
fastReruns = true
enableWebsocketCompression = true

[browser]
gatherUsageStats = false
serverAddress = "ai-data-analyst-platform-7rhs.onrender.com"
serverPort = 443

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "dark"
primaryColor = "#00F0FF"
backgroundColor = "#080C14"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
